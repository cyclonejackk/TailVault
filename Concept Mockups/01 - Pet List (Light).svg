<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 880" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif">
  <!-- Phone frame -->
  <rect x="4" y="4" width="412" height="872" rx="56" fill="#1a1a1c"/>
  <rect x="12" y="12" width="396" height="856" rx="48" fill="#F2F2F7"/>
  <clipPath id="screen"><rect x="12" y="12" width="396" height="856" rx="48"/></clipPath>
  <g clip-path="url(#screen)">
    <!-- Dynamic island -->
    <rect x="148" y="24" width="124" height="34" rx="17" fill="#1a1a1c"/>
    <!-- Status bar -->
    <text x="60" y="46" font-size="15" font-weight="600" fill="#000">9:41</text>
    <text x="330" y="46" font-size="13" fill="#000">📶 🔋</text>

    <!-- Nav bar -->
    <text x="34" y="112" font-size="17" fill="#0A84FF">⇪</text>
    <text x="376" y="112" font-size="20" fill="#0A84FF" text-anchor="end">＋</text>
    <text x="34" y="152" font-size="32" font-weight="700" fill="#000">Pets (8)</text>

    <!-- Search -->
    <rect x="30" y="170" width="360" height="38" rx="12" fill="#E3E3E8"/>
    <text x="46" y="195" font-size="16" fill="#8E8E93">🔍  Search pets</text>

    <!-- List card -->
    <rect x="30" y="222" width="360" height="536" rx="14" fill="#FFFFFF"/>

    <!-- Row: Atwood -->
    <circle cx="66" cy="256" r="24" fill="#3B3B3F"/>
    <text x="66" y="263" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">A</text>
    <text x="102" y="250" font-size="17" font-weight="600" fill="#000">Atwood</text>
    <text x="102" y="270" font-size="14" fill="#8E8E93">Solid black · 13y 2m</text>
    <text x="102" y="288" font-size="12" fill="#E0559B">♥ 3 conditions</text>
    <text x="378" y="262" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="300" x2="390" y2="300" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Callen -->
    <circle cx="66" cy="334" r="24" fill="#5856D6"/>
    <text x="66" y="341" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">C</text>
    <text x="102" y="328" font-size="17" font-weight="600" fill="#000">Callen</text>
    <text x="102" y="348" font-size="14" fill="#8E8E93">Black and white tuxedo · 10y 10m</text>
    <text x="378" y="340" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="372" x2="390" y2="372" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Dice -->
    <circle cx="66" cy="406" r="24" fill="#AEAEB2"/>
    <text x="66" y="413" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">D</text>
    <text x="102" y="400" font-size="17" font-weight="600" fill="#000">Dice</text>
    <text x="102" y="420" font-size="14" fill="#8E8E93">White (solid) · 13y 3m</text>
    <text x="102" y="438" font-size="12" fill="#FF9500">💊 1 med</text>
    <text x="170" y="438" font-size="12" fill="#E0559B">♥ 5 conditions</text>
    <text x="378" y="412" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="450" x2="390" y2="450" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Fergus -->
    <circle cx="66" cy="484" r="24" fill="#8E8E93"/>
    <text x="66" y="491" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">F</text>
    <text x="102" y="478" font-size="17" font-weight="600" fill="#000">Fergus</text>
    <text x="102" y="498" font-size="14" fill="#8E8E93">Gray, ear-tipped · Age unknown</text>
    <text x="378" y="490" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="522" x2="390" y2="522" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Gothi -->
    <circle cx="66" cy="556" r="24" fill="#48484A"/>
    <text x="66" y="563" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">G</text>
    <text x="102" y="550" font-size="17" font-weight="600" fill="#000">Gothi</text>
    <text x="102" y="570" font-size="14" fill="#8E8E93">Dark gray (solid) · 6y 11m</text>
    <text x="378" y="562" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="594" x2="390" y2="594" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Hermione -->
    <circle cx="66" cy="628" r="24" fill="#64D2FF"/>
    <text x="66" y="635" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">H</text>
    <text x="102" y="622" font-size="17" font-weight="600" fill="#000">Hermione</text>
    <text x="102" y="642" font-size="14" fill="#8E8E93">Gray and white · 7y 1m</text>
    <text x="102" y="660" font-size="12" fill="#E0559B">♥ 4 conditions</text>
    <text x="378" y="634" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>
    <line x1="102" y1="672" x2="390" y2="672" stroke="#EDEDF0" stroke-width="1"/>

    <!-- Row: Midas -->
    <circle cx="66" cy="706" r="24" fill="#FF9500"/>
    <text x="66" y="713" font-size="19" font-weight="600" fill="#fff" text-anchor="middle">M</text>
    <text x="102" y="700" font-size="17" font-weight="600" fill="#000">Midas</text>
    <text x="102" y="720" font-size="14" fill="#8E8E93">Orange longhair · 6y 10m</text>
    <text x="102" y="738" font-size="12" fill="#30B0C7">🩺 Jun 26 recheck</text>
    <text x="378" y="712" font-size="16" fill="#C7C7CC" text-anchor="end">›</text>

    <!-- Tab bar -->
    <rect x="12" y="778" width="396" height="90" fill="#F9F9FB"/>
    <line x1="12" y1="778" x2="408" y2="778" stroke="#DDDDE0" stroke-width="1"/>
    <text x="70" y="812" font-size="22" text-anchor="middle">🐾</text>
    <text x="70" y="832" font-size="11" fill="#0A84FF" text-anchor="middle" font-weight="600">Pets</text>
    <text x="163" y="812" font-size="22" text-anchor="middle">✅</text>
    <text x="163" y="832" font-size="11" fill="#8E8E93" text-anchor="middle">Attendance</text>
    <text x="256" y="812" font-size="22" text-anchor="middle">📅</text>
    <text x="256" y="832" font-size="11" fill="#8E8E93" text-anchor="middle">Schedule</text>
    <text x="349" y="812" font-size="22" text-anchor="middle">⚙️</text>
    <text x="349" y="832" font-size="11" fill="#8E8E93" text-anchor="middle">Settings</text>
    <rect x="140" y="850" width="140" height="5" rx="2.5" fill="#1a1a1c"/>
  </g>
</svg>
